name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # 全历史: 历史扫描需要
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install ruff pytest pyyaml
      - run: ruff check xinli tools tests --select E9,F63,F7,F82  # 致命错误级
      - run: python tools/scan_secrets.py --root . --tracked
      - run: python tools/scan_secrets.py --history   # 全部 git 对象体检(含不可达)
      - run: pytest tests/ -q
